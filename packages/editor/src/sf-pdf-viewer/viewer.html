<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DocEngine PDF preview</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #525659;
        font-family: system-ui, sans-serif;
      }
      #status {
        color: #fff;
        text-align: center;
        padding: 2rem 1rem;
      }
      #status[hidden] {
        display: none;
      }
      #embed {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
      #embed[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="status">Waiting for PDF…</div>
    <embed id="embed" type="application/pdf" hidden />
    <script src="viewer.js"></script>
  </body>
</html>
