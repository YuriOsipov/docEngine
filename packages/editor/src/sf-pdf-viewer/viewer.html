<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DocEngine PDF preview</title>
    <style>
      html,
      body {
        margin: 0;
        background: #525659;
        font-family: system-ui, sans-serif;
      }
      #status {
        color: #fff;
        text-align: center;
        padding: 2rem 1rem;
      }
      #pages {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        padding: 1rem;
        box-sizing: border-box;
      }
      #pages canvas {
        display: block;
        max-width: 100%;
        height: auto;
        background: #fff;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
      }
    </style>
  </head>
  <body>
    <div id="status">Waiting for PDF…</div>
    <div id="pages"></div>
    <script src="viewer.js"></script>
  </body>
</html>
